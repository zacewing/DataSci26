# Publishes the website/ folder to GitHub Pages every time main is pushed.
# GitHub Pages can only publish the repo root or a docs/ folder on its own,
# so this tells it to use website/ instead.
# The site is static there: the Dashboard tab shows the simulated demo
# (website/data/dashboard-sim.json), and real logs never leave this computer.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # also allows a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The Dashboard's "try it with your own log" runs the Python analysis in the
      # visitor's browser (website/upload.js), so publish src/ next to the site.
      # Copied at deploy time so there's only ever one copy of the code in the repo.
      - name: Copy the analysis code into the site
        run: mkdir -p website/py && cp -r src website/py/src && rm -rf website/py/src/__pycache__
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
